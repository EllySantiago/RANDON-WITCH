let timers = [], paused = false;
const scr = document.getElementById('screen');

function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function playScene(idx) {
  clearTimers();
  paused = false;
  document.getElementById('pauseBtn').textContent = '⏸ Pausar';
  document.getElementById('cur').style.display = '';
  scr.innerHTML = '';
  const frames = scenes[idx];
  frames.forEach(f => {
    timers.push(setTimeout(() => { scr.innerHTML += f.txt; }, f.t));
  });
  const last = frames[frames.length - 1].t;
  timers.push(setTimeout(() => {
    document.getElementById('cur').style.display = 'none';
    if (idx < scenes.length - 1) setTimeout(() => playScene(idx + 1), 1500);
  }, last + 800));
}

function restart() { playScene(0); }

function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ Continuar' : '⏸ Pausar';
}
